"""
DevOps Pipeline Configuration

This file defines the pipeline for testing business controls.
"""
name: Business Controls Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run tests
      run: |
        pytest
    
    - name: Run controls
      run: |
        python -m src.business_controls_framework.main --output results.json
    
    - name: Upload results
      uses: actions/upload-artifact@v2
      with:
        name: control-results
        path: results.json
